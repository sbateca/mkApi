services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: microlab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    image: ${IMAGE_NAME:-mkapi}
    environment:
      database_url: postgresql+asyncpg://postgres:0000@postgres:5432/microlab
    ports:
      - "${HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
