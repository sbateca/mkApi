[project]
name = "mkapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Sergio Bateca"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "greenlet (>=3.5.1,<4.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.15,<0.16.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]


[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort/import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

ignore = [
    "E501", # line too long; lo maneja el formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # assert permitido en tests, útil si luego activas reglas de seguridad
]

[tool.ruff.lint.isort]
known-first-party = [
    "application",
    "domain",
    "infrastructure",
    "main",
    "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "src/**/__init__.py",
    "src/**/util/**",
    "src/main.py",
    "src/application/dto/**",
    "src/domain/model/**",
    "src/spi/**",
    "src/infrastructure/configuration/**",
]
