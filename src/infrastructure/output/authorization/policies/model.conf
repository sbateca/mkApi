[request_definition]
r = role, resource, action, actor_client, resource_client

[policy_definition]
p = role, resource, action, scope

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = keyMatch(r.role, p.role) && keyMatch(r.resource, p.resource) && keyMatch(r.action, p.action) && (p.scope == "all" || (p.scope == "own" && r.actor_client != "" && (r.resource_client == "" || r.actor_client == r.resource_client)))
